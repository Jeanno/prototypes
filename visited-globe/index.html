<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wanderglobe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#03050d;
  --glass:rgba(13,19,38,.58);
  --glass-strong:rgba(15,22,44,.86);
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.16);
  --text:#e9edf7;
  --muted:#8d97b3;
  --faint:#5b6583;
  --accent:#ff8a5b;
  --accent-soft:color-mix(in srgb, var(--accent) 18%, transparent);
  --radius:20px;
  --serif:"Instrument Serif", ui-serif, Georgia, serif;
  --sans:Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#scene{position:fixed;inset:0;display:block;touch-action:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 60% 50%,transparent 45%,rgba(0,0,0,.55) 100%)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 20px 60px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}

/* Panel */
#panel{position:fixed;top:16px;left:16px;bottom:16px;width:340px;border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;z-index:5;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
body.loading #panel{transform:translateX(-24px);opacity:0}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 6px}
.brand h1{margin:0;font:400 28px/1 var(--serif);letter-spacing:.2px}
.brand h1 em{color:var(--accent);transition:color .4s}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.logo{width:36px;height:36px;flex:none}
.sec{padding:14px 20px}
.sec + .sec{border-top:1px solid var(--line)}
.label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}

.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;color:#0b1020;background:var(--c);box-shadow:0 0 0 2px var(--bg),0 0 0 2px transparent;transition:transform .2s,box-shadow .25s}
.chip:hover{transform:translateY(-2px)}
.chip.on{box-shadow:0 0 0 2px #0b1020,0 0 0 4px var(--c),0 0 24px -2px var(--c)}
.chip .n{position:absolute;right:-4px;bottom:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#0d1326;color:var(--text);font-size:10px;display:grid;place-items:center;border:1px solid var(--line-strong)}
.chip.add{background:transparent;color:var(--muted);border:1px dashed var(--line-strong)}
.chip.add:hover{color:var(--text);border-color:var(--muted)}

.me-row{display:flex;align-items:center;gap:8px}
.pname{flex:1;min-width:0;background:transparent;border:0;outline:0;font:400 26px/1.1 var(--serif);padding:2px 0;border-bottom:1px solid transparent;transition:border-color .2s}
.pname:hover{border-bottom-color:var(--line)}
.pname:focus{border-bottom-color:var(--accent)}
.iconbtn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.iconbtn:hover{background:rgba(255,255,255,.06);color:var(--text)}
.swatches{display:flex;gap:7px;margin-top:10px}
.sw{width:18px;height:18px;border-radius:50%;background:var(--c);opacity:.55;transition:opacity .2s,transform .2s}
.sw:hover{opacity:1;transform:scale(1.12)}
.sw.on{opacity:1;box-shadow:0 0 0 2px #0b1020,0 0 0 3.5px var(--c)}
.homeline{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.homeline b{color:var(--text);font-weight:500}
.moved{margin-left:auto;font-size:11.5px;color:var(--accent);padding:2px 8px;border-radius:7px}
.moved:hover{background:var(--accent-soft)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.stat .v{font:400 30px/1 var(--serif);letter-spacing:.3px}
.stat .v small{font:500 11px var(--sans);color:var(--faint);margin-left:3px}
.stat .k{font-size:11px;color:var(--muted);margin-top:5px}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 50%,transparent),var(--accent));box-shadow:0 0 12px var(--accent);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.barcap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:7px}
.conts{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.cont{font-size:10.5px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--faint);transition:all .3s}
.cont.on{color:var(--text);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-soft)}

.tabs{display:flex;gap:4px;padding:4px;margin:0 20px;border-radius:12px;background:rgba(255,255,255,.04)}
.tab{flex:1;padding:7px 0;border-radius:9px;color:var(--muted);font-size:12.5px;font-weight:500;transition:all .2s}
.tab.on{background:rgba(255,255,255,.08);color:var(--text)}
.list{flex:1;overflow:auto;padding:10px 12px 12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .15s}
.item:hover{background:rgba(255,255,255,.05)}
.item .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 10px var(--c,var(--accent));flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t b svg{vertical-align:-1px;color:var(--c)}
.item .t span{font-size:11.5px;color:var(--muted)}
.item .km{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.item .del{opacity:0;color:var(--faint);width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.item:hover .del{opacity:1}
.item .del:hover{color:#ff8f8f;background:rgba(255,120,120,.1)}
.group-h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:12px 10px 4px}
.flag{font-size:16px;width:20px;text-align:center;flex:none}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:13px}
.empty .big{font:italic 400 22px/1.2 var(--serif);color:var(--text);margin-bottom:6px}
.foot{display:flex;gap:6px;padding:12px;border-top:1px solid var(--line)}
.fbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 6px;border-radius:11px;color:var(--muted);font-size:12px;font-weight:500;transition:all .2s}
.fbtn:hover{background:rgba(255,255,255,.05);color:var(--text)}
.fbtn.on{background:var(--accent-soft);color:var(--text)}
.sheet-handle{display:none}
.hide-c{}

/* Search */
#search{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));z-index:6;margin-left:178px;transition:opacity .6s .2s}
body.loading #search{opacity:0}
.sbox{display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;border-radius:16px}
.sbox input{flex:1;background:none;border:0;outline:0;font-size:14px}
.sbox input::placeholder{color:var(--faint)}
.kbd{font-size:11px;color:var(--faint);border:1px solid var(--line-strong);border-radius:6px;padding:1px 6px}
.results{margin-top:8px;border-radius:16px;padding:6px;display:none;max-height:60vh;overflow:auto;background:var(--glass-strong)}
.results.open{display:block}
.res{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer}
.res.sel,.res:hover{background:rgba(255,255,255,.07)}
.res b{font-weight:500}
.res span{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.res .ico{width:20px;text-align:center;flex:none;color:var(--muted)}
.res-h{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px 4px}

/* View switch */
#views{position:fixed;top:16px;right:16px;z-index:6;display:flex;padding:4px;border-radius:14px;height:48px;align-items:center;transition:opacity .6s .3s}
body.loading #views{opacity:0}
#views button{position:relative;z-index:1;height:38px;padding:0 16px;border-radius:10px;color:var(--muted);font-size:12.5px;font-weight:500;transition:color .25s}
#views button.on{color:#0b1020}
.vthumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;background:var(--accent);box-shadow:0 6px 18px -6px var(--accent);transition:transform .35s cubic-bezier(.2,.8,.2,1),width .35s}

/* Popover */
#pop{position:fixed;left:0;top:0;width:280px;border-radius:18px;padding:16px;z-index:7;opacity:0;pointer-events:none;transform-origin:0 0;transition:opacity .2s;background:var(--glass-strong)}
#pop.open{opacity:1;pointer-events:auto}
#pop.hidden{opacity:0;pointer-events:none}
#pop::before{content:"";position:absolute;left:var(--ax,-6px);top:22px;width:12px;height:12px;background:inherit;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);display:none}
.pk{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;padding-right:22px}
.pk .flag{font-size:14px;width:auto}
#pop h3{margin:6px 0 2px;font:400 28px/1.05 var(--serif)}
.pnat{font:400 19px/1.2 var(--serif);color:var(--muted);margin:0 0 4px}
.psub svg{vertical-align:-1px}
.nl{font-style:normal;font-weight:400;color:var(--muted);margin-left:7px;font-size:.92em}
.res .nl{margin-left:0}
.hhint{font-size:12px;line-height:1.45;color:var(--muted);margin:-2px 0 16px}
.psub{color:var(--muted);font-size:12.5px;margin-bottom:4px}
.pnote{font:italic 400 17px/1.35 var(--serif);color:#cfd6e8;margin:8px 0 2px}
.visitors{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vchip{display:flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px 2px 3px;border-radius:99px;background:rgba(255,255,255,.05)}
.vchip i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.acts{display:flex;gap:6px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 13px;border-radius:11px;font-weight:500;font-size:12.5px;background:rgba(255,255,255,.07);transition:all .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--accent);color:#0b1020;box-shadow:0 6px 20px -6px var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.on{background:var(--accent-soft);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn.grow{flex:1}
.acts.wrap{flex-wrap:wrap}
.acts.wrap .btn.grow:first-child{flex-basis:100%}
.btn.sq{width:36px;padding:0}
.btn.danger:hover{background:rgba(255,110,110,.15);color:#ffb0b0}
.x{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:rgba(255,255,255,.07);color:var(--text)}

/* City menu */
#pop.wide{width:310px}
.cm-head{display:flex;align-items:center;gap:6px;margin:-4px 0 10px -6px;padding-right:28px}
.cm-head b{font:400 23px/1.1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-sub{font-size:11px;color:var(--muted);margin:-8px 0 10px 28px}
.cm-q{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:8px 11px;outline:0;margin-bottom:6px;transition:border-color .2s}
.cm-q:focus{border-color:color-mix(in srgb,var(--accent) 70%,transparent)}
.cm-list{max-height:min(300px,42vh);overflow:auto;margin:0 -8px;padding:0 2px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.cm-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:13px;user-select:none}
.cm-row:hover{background:rgba(255,255,255,.06)}
.cb{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none;color:transparent;transition:all .15s}
.cb svg{width:12px;height:12px;stroke-width:2.6}
.cm-row.on .cb{background:var(--accent);border-color:var(--accent);color:#0b1020}
.cm-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-row .nm i{font-style:normal;font-size:9.5px;color:var(--faint);margin-left:7px;text-transform:uppercase;letter-spacing:.1em}
.cm-row .pp{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.cm-empty{padding:14px 8px;color:var(--muted);font-size:12.5px}

/* Labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;font-size:11px;font-weight:500;padding:3px 8px 3px 7px;border-radius:7px;background:rgba(6,10,22,.62);border-left:2px solid var(--c);white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .25s;will-change:transform}
.lbl.country{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;background:rgba(6,10,22,.78);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-left-width:2px}
.lbl .cnt{margin-left:7px;padding:0 5px;border-radius:5px;background:var(--c);color:#0b1020;font-size:9.5px;letter-spacing:0}
.lbl.home{font:italic 400 14px/1.1 var(--serif);border-left:0;padding:3px 9px;background:rgba(255,231,163,.14);color:#ffe7a3}
.lbl .nat{margin-left:6px;font-weight:400;opacity:.62;text-transform:none;letter-spacing:0}
.lbl.home .nat{font:inherit;opacity:.7}
.lbl .yr{margin-left:7px;font:500 9.5px/1 var(--sans);font-style:normal;letter-spacing:.04em;opacity:.6}
.lbl.home.past{background:rgba(255,231,163,.06);color:#cdbb86;font-size:12.5px}
.lbl.hot{background:rgba(6,10,22,.9);z-index:2}

#tip{position:fixed;left:0;top:0;pointer-events:none;z-index:4;padding:6px 11px;border-radius:10px;font-size:12.5px;font-weight:500;display:flex;gap:7px;align-items:center;opacity:0;transition:opacity .15s;background:var(--glass-strong)}
#tip.on{opacity:1}
#tip .tn{color:var(--muted);font-weight:400}
#tip .tv{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* Modal */
#modal,#hmodal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(2,4,10,.5);opacity:0;pointer-events:none;transition:opacity .25s;padding:16px}
#modal.open,#hmodal.open{opacity:1;pointer-events:auto}
.mcard{width:min(400px,100%);border-radius:22px;padding:22px;background:var(--glass-strong);transform:translateY(10px) scale(.98);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#modal.open .mcard,#hmodal.open .mcard{transform:none}
.mcard h2{margin:0 0 2px;font:400 30px/1.1 var(--serif)}
.mcard .psub{margin-bottom:16px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input,.field textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0;transition:border-color .2s;resize:none;color-scheme:dark}
.field input:focus,.field textarea:focus{border-color:color-mix(in srgb,var(--accent) 70%,transparent)}
.check{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);margin:4px 0 16px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.mrow{display:flex;gap:8px;justify-content:flex-end}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:30;padding:10px 12px 10px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;font-size:13px;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1);background:var(--glass-strong)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--accent);font-weight:600;font-size:12.5px;padding:4px 8px;border-radius:8px}
#toast button:hover{background:rgba(255,255,255,.06)}

#hint{position:fixed;right:20px;bottom:18px;z-index:2;color:var(--faint);font-size:11.5px;text-align:right;transition:opacity .6s 1s}
body.loading #hint{opacity:0}
#hint b{color:var(--muted);font-weight:500}

#loader{position:fixed;inset:0;display:grid;place-items:center;z-index:40;transition:opacity .9s;pointer-events:none}
body:not(.loading) #loader{opacity:0}
#loader div{text-align:center}
#loader h1{margin:0;font:italic 400 44px/1 var(--serif)}
#loader p{margin:10px 0 0;color:var(--muted);font-size:13px;letter-spacing:.04em}
.shimmer{background:linear-gradient(90deg,#5b6583 0%,#e9edf7 50%,#5b6583 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.8s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
input[type=file]{display:none}

@media (max-width:760px){
  #search{margin-left:0;top:max(12px,env(safe-area-inset-top))}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:84vh;border-radius:22px;transition:max-height .45s cubic-bezier(.2,.8,.2,1),transform .5s,opacity .5s}
  #panel.collapsed{max-height:176px}
  #panel.collapsed .hide-c{display:none}
  .sheet-handle{display:block;width:100%;height:22px;flex:none;position:relative}
  .sheet-handle::after{content:"";position:absolute;left:50%;top:9px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:rgba(255,255,255,.22)}
  .hide-m{display:none}
  .brand{display:none}
  .sec{padding:12px 16px}
  .stats{grid-template-columns:repeat(4,1fr);gap:6px}
  .stat{padding:9px 8px}
  .stat .v{font-size:22px}
  .stat .v small{display:none}
  .stat .k{font-size:10px}
  .bar,.barcap,.conts,.swatches,.homeline{display:none}
  #panel:not(.collapsed) .swatches,#panel:not(.collapsed) .homeline{display:flex}
  #hint{display:none}
  #views{top:calc(max(12px,env(safe-area-inset-top)) + 56px);right:12px;height:40px}
  #views button{height:32px;padding:0 12px}
  #pop{width:min(280px,calc(100vw - 24px))}
}
</style>

<body class="loading">
<canvas id="scene"></canvas>
<div class="vignette"></div>
<div id="labels"></div>
<div id="tip" class="glass"></div>

<div id="loader"><div><h1 class="shimmer">Wanderglobe</h1><p id="loadmsg">Charting the world…</p></div></div>

<aside id="panel" class="glass collapsed">
  <button class="sheet-handle" id="handle" aria-label="Expand panel"></button>
  <header class="brand">
    <svg class="logo" viewBox="0 0 36 36"><defs><radialGradient id="lg" cx="35%" cy="35%"><stop offset="0" stop-color="#9cc3ff"/><stop offset="1" stop-color="#1b2d63"/></radialGradient></defs><circle cx="18" cy="18" r="11" fill="url(#lg)"/><ellipse cx="18" cy="18" rx="17" ry="6" fill="none" stroke="var(--accent)" stroke-width="1.4" transform="rotate(-24 18 18)" opacity=".9"/><circle cx="31.4" cy="11.5" r="2.2" fill="var(--accent)"/></svg>
    <div><h1>Wander<em>globe</em></h1><p>Every place you've been, glowing.</p></div>
  </header>
  <section class="sec">
    <div class="label hide-m">Travellers</div>
    <div class="chips" id="chips"></div>
  </section>
  <section class="sec hide-c">
    <div class="me-row">

  $('#chips').innerHTML = state.profiles.map(q => `<button class="chip ${q.id === p.id ? 'on' : ''}" style="--c:${q.color}" data-pid="${q.id}" title="${esc(q.name)}">${esc((q.name.trim()[0] || '?').toUpperCase())}<span class="n">${touched(q).size}</span></button>`).join('') + `<button class="chip add" id="addp" title="New traveller">${icon('plus', 16)}</button>`;
  if (document.activeElement !== $('#pname')) $('#pname').value = p.name;
  $('#pdel').style.visibility = state.profiles.length > 1 ? '' : 'hidden';
  $('#swatches').innerHTML = PALETTE.map(c => `<button class="sw ${c === p.color ? 'on' : ''}" style="--c:${c}" data-color="${c}" aria-label="Colour"></button>`).join('');
  const ch = currentHome(p), earlier = p.homes.length - 1;
  $('#homeline').innerHTML = ch ? `${icon('home', 14)}<span>Home · <b>${esc(ch.name)}</b>${earlier ? ` · ${earlier} earlier` : ''}</span><button class="moved" id="moved">Moved?</button>` : `${icon('home', 14)}<span>Click the globe and tap ⌂ to set home</span>`;

  const s = profileStats(p);
  const statsEl = $('#stats');
  if (!statsEl.children.length) statsEl.innerHTML = ['Countries', 'Continents', 'Places', 'Kilometres'].map(k => `<div class="stat"><div class="v">0<small></small></div><div class="k">${k}</div></div>`).join('');
  const vs = statsEl.querySelectorAll('.v');
  countTo(vs[0], s.all); vs[0].querySelector('small').textContent = `/ ${UN_TOTAL}`;
  countTo(vs[1], s.conts.size); vs[1].querySelector('small').textContent = '/ 7';
  countTo(vs[2], p.places.length);
  countTo(vs[3], Math.round(s.dist));
  $('#landbar').style.width = Math.min(100, s.all / UN_TOTAL * 100) + '%';
  $('#landcap').textContent = `${Math.round(s.all / UN_TOTAL * 100)}% of the world · ${p.countries.length} country ${p.countries.length === 1 ? 'pin' : 'pins'} · ${p.places.length} ${p.places.length === 1 ? 'place' : 'places'}`;
  if (state.compare && state.profiles.length > 1) {
    const shared = state.profiles.map(q => new Set(q.countries)).reduce((a, b) => new Set([...a].filter(x => b.has(x))));
    $('#sharedcap').textContent = `${shared.size} shared`;
  } else $('#sharedcap').textContent = '';
  $('#conts').innerHTML = CONTINENTS.map(c => `<span class="cont ${s.conts.has(c) ? 'on' : ''}">${c}</span>`).join('');

  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#list').innerHTML = tab === 'places' ? placesList(p) : countriesList(p);

  renderViews();
  $('#compare').innerHTML = `${icon('users', 15)}${state.compare ? 'Showing all' : 'Compare'}`;
  $('#compare').classList.toggle('on', state.compare);
  $('#compare').style.display = state.profiles.length > 1 ? '' : 'none';
  $('#export').innerHTML = `${icon('down', 15)}Export`;
  $('#import').innerHTML = `${icon('up', 15)}Import`;
}
function renderViews() {
  const btns = [...document.querySelectorAll('#views button')], on = btns.find(b => b.dataset.view === state.view);
  btns.forEach(b => b.classList.toggle('on', b === on));
  const th = $('.vthumb');
  th.style.width = on.offsetWidth + 'px';
  th.style.transform = `translateX(${on.offsetLeft - 4}px)`;
}
$('#views').addEventListener('click', e => {
  const v = e.target.closest('[data-view]')?.dataset.view;
  if (!v || v === state.view) return;
  state.view = v; closePop(); commit();
});
addEventListener('resize', () => renderViews());
function placesList(p) {
  if (!p.places.length && !p.homes.length) return `<div class="empty"><div class="big">Where have you been?</div>Search for a city or click the globe to pin where you've been.</div>`;
  const items = [...p.places].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const row = (pl, home) => {
    const c = COUNTRIES[ciOf(pl)], nat = localOf(pl), h = home ? null : homeAt(p, pl.date);
    const sub = home ? [homeUntil(p, pl) ? 'Earlier home' : 'Home', homePeriod(p, pl)].filter(Boolean).join(' · ') : [c?.name, fmtDate(pl.date)].filter(Boolean).join(' · ') || fmtLL(pl.lat, pl.lon);
    const id = home ? 'home:' + pl.id : pl.id;
    return `<div class="item ${home ? 'home' : ''}" data-place="${id}" style="--c:${home ? HOME_COLOR : p.color}">
      <span class="flag">${c ? flagOf(c.iso2) : '🌊'}</span>
      <div class="t"><b>${home ? icon('home', 12) + ' ' : ''}${esc(pl.name)}${nat ? `<em class="nl">${esc(nat)}</em>` : ''}</b><span>${esc(sub)}</span></div>
      ${h ? `<span class="km" title="from ${esc(h.name)}">${nf(km(h, pl))} km</span>` : ''}
      <button class="del" data-del-place="${id}" title="Remove">${icon('x', 14)}</button></div>`;
  };
  return homesOf(p).reverse().map(h => row(h, true)).join('') + items.map(pl => row(pl, false)).join('');
}
function countriesList(p) {
  const cs = [...touched(p)].map(k => byKey.get(k));
  if (!cs.length) return `<div class="empty"><div class="big">A blank map.</div>Pin a city, or drop a country pin when you'd rather not name places.</div>`;
  const inC = c => p.places.filter(pl => countryNear(pl.lat, pl.lon) === c.i).map(pl => pl.name);
  const groups = {};
  for (const c of cs) (groups[c.cont || 'Elsewhere'] ||= []).push(c);
  return Object.keys(groups).sort().map(g => `<div class="group-h">${g} · ${groups[g].length}</div>` + groups[g].sort((a, b) => a.name.localeCompare(b.name)).map(c => `
    <div class="item" data-country="${esc(c.key)}"><span class="flag">${flagOf(c.iso2)}</span><div class="t"><b>${esc(c.name)}${c.native ? `<em class="nl">${esc(c.native)}</em>` : ''}</b><span>${esc([p.countries.includes(c.key) ? 'Country pin' : '', ...inC(c)].filter(Boolean).join(' · ') || 'Home')}</span></div>
    ${p.countries.includes(c.key) ? `<button class="del" data-del-country="${esc(c.key)}" title="Remove country pin">${icon('x', 14)}</button>` : ''}</div>`).join('')).join('');
}

$('#panel').addEventListener('click', e => {
  const t = e.target, p = active();
  const chip = t.closest('[data-pid]');
  if (chip) {
    if (chip.dataset.pid === state.activeId && MOBILE) return $('#panel').classList.toggle('collapsed');
    state.activeId = chip.dataset.pid; commit(); closePop();
    const np = active(), at = currentHome(np) || np.places[0];
    if (at) flyTo(at.lat, at.lon);
    return;
  }
  if (t.closest('#addp')) {
    const used = new Set(state.profiles.map(q => q.color));
    const np = newProfile(`Traveller ${state.profiles.length + 1}`, PALETTE.find(c => !used.has(c)) || PALETTE[state.profiles.length % PALETTE.length]);
    state.profiles.push(np); state.activeId = np.id; commit();
    $('#panel').classList.remove('collapsed');
    setTimeout(() => { $('#pname').focus(); $('#pname').select(); }, 30);
    return;
  }
  if (t.closest('#moved')) { toast('Find your new home on the globe or in search, then tap ⌂ and enter the month you moved'); if (!MOBILE) q.focus(); return; }
  const sw = t.closest('[data-color]');
  if (sw) { p.color = sw.dataset.color; commit(); return; }
  const tb = t.closest('[data-tab]');
  if (tb) { tab = tb.dataset.tab; renderPanel(); return; }
  const dp = t.closest('[data-del-place]');
  if (dp) {
    e.stopPropagation();
    const hid = dp.dataset.delPlace.startsWith('home:') && dp.dataset.delPlace.slice(5);
    if (hid) removeHome(p, p.homes.find(h => h.id === hid));
    else { const idx = p.places.findIndex(x => x.id === dp.dataset.delPlace), pl = p.places[idx]; p.places.splice(idx, 1); commit(); toast(`Removed ${pl.name}`, () => { p.places.splice(idx, 0, pl); commit(); }); }
    return;
  }
  const dc = t.closest('[data-del-country]');
  if (dc) { e.stopPropagation(); const c = byKey.get(dc.dataset.delCountry); if (c) toggleCountry(c); return; }
  const it = t.closest('[data-place]');
  if (it) {
    const isH = it.dataset.place.startsWith('home:');
    const pl = isH ? p.homes.find(h => 'home:' + h.id === it.dataset.place) : p.places.find(x => x.id === it.dataset.place);
    if (!pl) return;
    if (state.view !== 'cities' && !isH) { state.view = 'cities'; commit(); }
    flyTo(pl.lat, pl.lon, 2.2);
    const pin = pins.find(x => x.place === pl);
    if (pin) setTimeout(() => openPinPop(pin), 300);
    return;
  }
  const ic = t.closest('[data-country]');
  if (ic) { const c = byKey.get(ic.dataset.country), cp = pins.find(x => x.isCountry && x.place.key === c.key && x.profile === p); flyTo(c.lat, c.lon); setTimeout(() => cp ? openPinPop(cp) : openSpotPop({ lat: c.lat, lon: c.lon, ci: c.i, whole: true }), 300); }
});
$('#handle').onclick = () => $('#panel').classList.toggle('collapsed');
$('#pname').addEventListener('input', e => { active().name = e.target.value || 'Unnamed'; save(); renderChipsOnly(); });
$('#pname').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
function renderChipsOnly() { const p = active(), chip = document.querySelector(`[data-pid="${p.id}"]`); if (chip) { chip.firstChild.nodeValue = (p.name.trim()[0] || '?').toUpperCase(); chip.title = p.name; } }
$('#pdel').innerHTML = icon('trash', 16);
$('#pdel').onclick = () => {
  const p = active();
  if (state.profiles.length < 2 || !confirm(`Delete ${p.name} and their ${p.countries.length} countries and ${p.places.length} places?`)) return;
  const idx = state.profiles.indexOf(p);
  state.profiles.splice(idx, 1); state.activeId = state.profiles[0].id;
  if (state.profiles.length < 2) state.compare = false;
  commit(); toast(`Deleted ${p.name}`, () => { state.profiles.splice(idx, 0, p); state.activeId = p.id; commit(); });
};
$('#compare').onclick = () => { state.compare = !state.compare; commit(); };
$('#export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'wanderglobe', version: 1, ...state }, null, 2)], { type: 'application/json' }));
  a.download = `wanderglobe-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#import').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const incoming = (d.profiles || []).filter(p => p && typeof p.name === 'string');
    if (!incoming.length) throw new Error('No profiles');
    for (const p of incoming) state.profiles.push({ id: uid(), name: p.name, color: PALETTE.includes(p.color) ? p.color : PALETTE[0], countries: (p.countries || []).filter(k => byKey.has(k)), places: (p.places || []).filter(x => isFinite(x.lat) && isFinite(x.lon)).map(x => ({ id: uid(), name: String(x.name || 'Place'), local: String(x.local || ''), lat: +x.lat, lon: +x.lon, date: x.date || '', note: x.note || '' })), homes: [...(p.homes || []), ...(p.home ? [p.home] : [])].map(h => cleanHome({ ...h, id: '' })).filter(Boolean) });
    commit(); toast(`Imported ${incoming.length} traveller${incoming.length > 1 ? 's' : ''}`);
  } catch { toast("That file doesn't look like a Wanderglobe export"); }
};

function commit() { save(); refreshWorld(); renderPanel(); if (popState?.kind === 'spot') openSpotPop(popState.spot); }

/* ---------------- search ---------------- */
const q = $('#q'), results = $('#results');
$('#sico').innerHTML = icon('search', 17);
const isoName = new Map();
let items = [], sel = 0, geoTimer = 0, geoSeq = 0;
function searchIndex() {
  if (!isoName.size) for (const c of COUNTRIES) if (c.iso2) isoName.set(c.iso2, c);
  return [
    ...COUNTRIES.filter(c => c.key !== 'Siachen Glacier').map(c => ({ kind: 'country', label: c.name, local: c.native, alt: c.key, sub: c.cont, flag: flagOf(c.iso2), lat: c.lat, lon: c.lon, ci: c.i })),
    ...CITIES.map(([n, iso, lat, lon]) => { const c = isoName.get(iso), local = CITY_DB?.[iso]?.find(x => x[0] === n)?.[5] || ''; return { kind: 'city', label: n, local, sub: c?.name || '', flag: flagOf(iso), lat, lon, ci: -1, pop: 2000 }; }),
    ...Object.entries(CITY_DB || {}).flatMap(([iso, list]) => { const c = isoName.get(iso), have = new Set(CITIES.filter(x => x[1] === iso).map(x => x[0])); return list.filter(x => !have.has(x[0])).map(([n, lat, lon, pop, , local]) => ({ kind: 'city', label: n, local: local || '', sub: c?.name || iso, flag: flagOf(iso), lat, lon, ci: -1, pop })); }),
  ].map(it => ({ ...it, nl: it.local ? fold(it.local) : '' }));
}
let INDEX = null;
function runSearch() {
  INDEX ||= searchIndex();
  const s = q.value.trim().toLowerCase();
  if (!s) { results.classList.remove('open'); return; }
  const norm = x => x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const ns = norm(s);
  const scored = [];
  for (const it of INDEX) {
    const l = norm(it.label), a = it.alt ? norm(it.alt) : '';
    const sc = l.startsWith(ns) ? 0 : a.startsWith(ns) || it.nl.startsWith(ns) ? 1 : l.includes(' ' + ns) ? 2 : l.includes(ns) || it.nl.includes(ns) ? 3 : -1;
    if (sc >= 0) scored.push([sc + (it.kind === 'city' ? 0.5 : 0), it]);
  }
  items = scored.sort((a, b) => a[0] - b[0] || (b[1].pop || 0) - (a[1].pop || 0) || a[1].label.localeCompare(b[1].label)).slice(0, 8).map(x => x[1]);
  sel = 0; drawResults(true);
  clearTimeout(geoTimer);
  if (s.length >= 3) geoTimer = setTimeout(() => geocode(s), 450);
}
async function geocode(s) {
  const seq = ++geoSeq;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&namedetails=1&q=${encodeURIComponent(s)}`, { headers: { 'Accept-Language': navigator.language || 'en' } });
    const d = await r.json();
    if (seq !== geoSeq || q.value.trim().toLowerCase() !== s) return;
    const extra = d.map(x => { const lat = +x.lat, lon = +x.lon, ci = countryNear(lat, lon), c = ci >= 0 ? COUNTRIES[ci] : null, label = x.name || x.display_name.split(',')[0]; return { kind: 'geo', label, local: natOf(x.namedetails?.name, label), sub: x.display_name.split(',').slice(1, 3).join(',').trim(), flag: c ? flagOf(c.iso2) : '📍', lat, lon, ci: -1 }; })
      .filter(x => !items.some(i => i.label.toLowerCase() === x.label.toLowerCase() && Math.abs(i.lat - x.lat) < 0.5));
    items = [...items, ...extra];
    drawResults(false);
  } catch {}
}
function drawResults(pending) {
  if (!items.length && !pending) { results.innerHTML = `<div class="res-h">No matches</div>`; results.classList.add('open'); return; }
  let html = '', lastKind = '';
  items.forEach((it, i) => {
    const grp = it.kind === 'geo' ? 'Anywhere on Earth' : '';
    if (grp && grp !== lastKind) html += `<div class="res-h">${grp}</div>`;
    lastKind = grp || lastKind;
    const visited = it.kind === 'country' && active().countries.includes(COUNTRIES[it.ci].key);
    html += `<div class="res ${i === sel ? 'sel' : ''}" data-i="${i}"><span class="ico">${it.flag}</span><b>${esc(it.label)}</b>${it.local ? `<em class="nl">${esc(it.local)}</em>` : ''}${visited ? `<span style="color:var(--accent)">${icon('check', 14)}</span>` : ''}<span>${esc(it.sub)}</span></div>`;
  });
  results.innerHTML = html;
  results.classList.toggle('open', !!items.length);
}
function choose(it) {
  results.classList.remove('open'); q.value = ''; q.blur();
  const ci = it.kind === 'country' ? it.ci : countryNear(it.lat, it.lon);
  flyTo(it.lat, it.lon, it.kind === 'country' ? undefined : 2.1);
  setTimeout(() => openSpotPop({ lat: it.lat, lon: it.lon, ci, title: it.kind === 'country' ? '' : it.label, local: it.local, whole: it.kind === 'country' }), 350);
}
q.addEventListener('input', runSearch);
q.addEventListener('focus', () => { if (q.value) runSearch(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); drawResults(false); e.preventDefault(); }
  if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); drawResults(false); e.preventDefault(); }
  if (e.key === 'Enter' && items[sel]) choose(items[sel]);
  if (e.key === 'Escape') { q.value = ''; results.classList.remove('open'); q.blur(); }
});
results.addEventListener('pointerdown', e => { const r = e.target.closest('[data-i]'); if (r) { e.preventDefault(); choose(items[+r.dataset.i]); } });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape') { if (modal.classList.contains('open')) closeModal(); else if (hmodal.classList.contains('open')) closeHomeModal(); else closePop(); }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
});
try {
  const topo = await fetch(ATLAS).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  buildWorld(topo);
} catch (e) {
  console.error(e);
  $('#loadmsg').textContent = "Couldn't load the map. Check your connection and refresh.";
  throw e;
}
window.__wg = { state, COUNTRIES, flyTo, camera, countryAt, legsFor };
</script>
</body>
